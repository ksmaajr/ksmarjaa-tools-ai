[package]
name = "ksmarjaa-tools-ai"
version = "0.3.12"
description = "Local product generation workspace"
edition = "2021"

[lib]
name = "ksmarjaa_tools_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
keyring = { version = "3.6.3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
